<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@2.0.0-alpha.1/dist/leaflet.css"
        integrity="sha256-P+hWJNlpL+GBSRYC7cdsDbQH91URmpDeOzLp7DbFRtE=" crossorigin="" />
    <link rel="stylesheet" href="styles.css" />
    <title>Document</title>
</head>

<body>

    <div id="map-container">
        <div id="map">

        </div>
        <div id="search-container">
            <input type="text" id="recommendTerms"/>
            <button id="recommendBtn">Get Recommendations</button>
            <div id="recommend-loading" class="loading">Loading...</div>
            <div id="recommend-error" class="error">Error</div>
            <div id="recommend-results"></div>
        </div>
    </div>


    <!-- Leaflet -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet-src.min.js"
        integrity="sha512-3/WyQrhTdqSVmSifQS62akgtNBhZha2lS44TnoN9Jk3J01FvsKK4suVmz6t5FtccGb5iJw58GoFhBjPE5EPc8Q=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <!-- Google Map API for website -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDBHDMsqMNishcX0MHXSPwCfY62H1k1vfs" async
        defer></script>

    <!-- google mutant for Leaflet -->
    <script src='https://unpkg.com/leaflet.gridlayer.googlemutant@0.16.0/dist/Leaflet.GoogleMutant.js'></script>

    <!-- axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios@1.20.0/dist/axios.min.js"></script>

    <script src="data.js"></script>

    <script src="map.js"></script>

    <script src="script.js"></script>
</body>

</html>
